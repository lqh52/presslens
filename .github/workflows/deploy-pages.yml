name: Deploy PressLens to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run application tests
        run: npm test
      - name: Restore deployment catalogue
        run: |
          mkdir -p public/demo
          cp deploy/catalog/manifest.json public/demo/manifest.json
          cp deploy/catalog/search-index.json public/demo/search-index.json
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_MEDIA_ASSET_BASE_URL: ${{ secrets.MEDIA_ASSET_BASE_URL || vars.SUPABASE_ASSET_BASE_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_MEDIA_ASSET_BASE_URL" ]; then
            echo "::error::The media asset endpoint is not configured."
            exit 1
          fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
