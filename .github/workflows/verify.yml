name: Verify PressLens

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static application
        env:
          NEXT_PUBLIC_BASE_PATH: /presslens
          NEXT_PUBLIC_MEDIA_ASSET_BASE_URL: https://example.invalid/presslens-media
        run: npm run build

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -v
